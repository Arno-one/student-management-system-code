    <text x="58" y="112" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#B6C2D2">从切片召回精排到拒答，每丢段都服务于答得准，也知道何时不该答</text>
  </g>
