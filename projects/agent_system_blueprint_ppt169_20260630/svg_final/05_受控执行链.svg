<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7DD3FC" />
    </marker>
  </defs>
  <g id="background">
    <rect width="1280" height="720" fill="#05070D" />
    <path d="M50 140H1230 M50 630H1230" stroke="#1C2A3D" stroke-width="1" stroke-dasharray="8,4" />
  </g>
  <g id="header">
    <text x="56" y="72" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC">Planner 驱动把工具调用风险收敛到确定性链</text>
    <text x="58" y="112" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#B6C2D2">LLM 负责理解和计划，真正执行的是结构化步骤和确定性工具链</text>
  </g>
  <g id="step-intent">
    <path fill="#111827" stroke="#2A3A52" d="M68,198 H246 A6,6 0 0 1 252,204 V348 A6,6 0 0 1 246,354 H68 A6,6 0 0 1 62,348 V204 A6,6 0 0 1 68,198 Z" />
    <text x="86" y="238" font-family="Consolas, &quot;Microsoft YaHei&quot;, &quot;Courier New&quot;, monospace" font-size="18" fill="#7DD3FC">01</text>
    <text x="86" y="282" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">意图分类</text>
    <text x="86" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#B6C2D2">只判断任务本</text>
  </g>
  <g id="step-plan">
    <line x1="262" y1="276" x2="336" y2="276" stroke="#7DD3FC" stroke-width="2" marker-end="url(#arrowHead)" />
    <path fill="#111827" stroke="#2A3A52" d="M354,198 H532 A6,6 0 0 1 538,204 V348 A6,6 0 0 1 532,354 H354 A6,6 0 0 1 348,348 V204 A6,6 0 0 1 354,198 Z" />
    <text x="372" y="238" font-family="Consolas, &quot;Microsoft YaHei&quot;, &quot;Courier New&quot;, monospace" font-size="18" fill="#7DD3FC">02</text>
    <text x="372" y="282" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">计划生成</text>
    <text x="372" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#B6C2D2">输出结构化步</text>
  </g>
  <g id="step-executor">
    <line x1="548" y1="276" x2="622" y2="276" stroke="#7DD3FC" stroke-width="2" marker-end="url(#arrowHead)" />
    <path fill="#111827" stroke="#F59E0B" d="M640,198 H818 A6,6 0 0 1 824,204 V348 A6,6 0 0 1 818,354 H640 A6,6 0 0 1 634,348 V204 A6,6 0 0 1 640,198 Z" />
    <text x="658" y="238" font-family="Consolas, &quot;Microsoft YaHei&quot;, &quot;Courier New&quot;, monospace" font-size="18" fill="#F59E0B">03</text>
    <text x="658" y="282" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Executor</text>
    <text x="658" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#B6C2D2">按计划执</text>
  </g>
  <g id="step-tools">
    <line x1="834" y1="276" x2="908" y2="276" stroke="#7DD3FC" stroke-width="2" marker-end="url(#arrowHead)" />
    <path fill="#111827" stroke="#2A3A52" d="M926,198 H1104 A6,6 0 0 1 1110,204 V348 A6,6 0 0 1 1104,354 H926 A6,6 0 0 1 920,348 V204 A6,6 0 0 1 926,198 Z" />
    <text x="944" y="238" font-family="Consolas, &quot;Microsoft YaHei&quot;, &quot;Courier New&quot;, monospace" font-size="18" fill="#7DD3FC">04</text>
    <text x="944" y="282" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">工具</text>
    <text x="944" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#B6C2D2">统一 BaseTool</text>
  </g>
  <g id="step-persona">
    <path fill="#111827" stroke="#8B5CF6" d="M1006,410 H1184 A6,6 0 0 1 1190,416 V522 A6,6 0 0 1 1184,528 H1006 A6,6 0 0 1 1000,522 V416 A6,6 0 0 1 1006,410 Z" />
    <text x="1024" y="450" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Persona 回复</text>
    <text x="1024" y="488" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#B6C2D2">只影响么</text>
    <path d="M1015 354V398" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrowHead)" />
  </g>
  <g id="formula">
    <path fill="#111827" stroke="#2A3A52" d="M80,430 H858 A6,6 0 0 1 864,436 V520 A6,6 0 0 1 858,526 H80 A6,6 0 0 1 74,520 V436 A6,6 0 0 1 80,430 Z" />
    <image href="data:image/png;base64," x="113.22" y="459" width="679.56" height="42" />
    <text x="74" y="574" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#F59E0B">系统要降低的不是“AI 不会说话”，而是“不调调错重复调”</text>
  </g>
</svg>