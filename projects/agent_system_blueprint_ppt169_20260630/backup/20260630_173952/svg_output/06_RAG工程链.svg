<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7DD3FC"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="1280" height="720" fill="#05070D"/>
    <path d="M70 164H1210 M70 610H1210" stroke="#1C2A3D" stroke-width="1" stroke-dasharray="8,4"/>
  </g>
  <g id="header">
    <text x="56" y="72" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="52" font-weight="800" fill="#F8FAFC">RAG 不是向量库接入，而是丢条问答质量工程链</text>
    <text x="58" y="112" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">从切片召回精排到拒答，每丢段都服务于答得准，也知道何时不该答</text>
  </g>
  <g id="stage-ingest">
    <rect x="68" y="214" width="210" height="250" rx="6" fill="#111827" stroke="#2A3A52"/>
    <use data-icon="chunk-filled/database" x="92" y="238" width="34" height="34" fill="#7DD3FC"/>
    <text x="92" y="310" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="800" fill="#F8FAFC">入库治理</text>
    <text x="92" y="354" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">标题注入</text>
    <text x="92" y="388" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">500?chunk</text>
    <text x="92" y="422" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">多格式统丢</text>
  </g>
  <g id="stage-recall">
    <line x1="286" y1="340" x2="344" y2="340" stroke="#7DD3FC" stroke-width="2" marker-end="url(#arrowHead)"/>
    <rect x="356" y="214" width="210" height="250" rx="6" fill="#111827" stroke="#2A3A52"/>
    <use data-icon="chunk-filled/magnifying-glass" x="380" y="238" width="34" height="34" fill="#8B5CF6"/>
    <text x="380" y="310" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="800" fill="#F8FAFC">混合召回</text>
    <text x="380" y="354" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">Dense Vector</text>
    <text x="380" y="388" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">BM25 Sparse</text>
    <text x="380" y="422" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">RRF 融合</text>
  </g>
  <g id="stage-rerank">
    <line x1="574" y1="340" x2="632" y2="340" stroke="#7DD3FC" stroke-width="2" marker-end="url(#arrowHead)"/>
    <rect x="644" y="214" width="210" height="250" rx="6" fill="#111827" stroke="#2A3A52"/>
    <use data-icon="chunk-filled/bolt" x="668" y="238" width="34" height="34" fill="#F59E0B"/>
    <text x="668" y="310" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="800" fill="#F8FAFC">精排校准</text>
    <text x="668" y="354" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">CrossEncoder</text>
    <text x="668" y="388" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">QA 优先</text>
    <text x="668" y="422" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">原文回</text>
  </g>
  <g id="stage-context">
    <line x1="862" y1="340" x2="920" y2="340" stroke="#7DD3FC" stroke-width="2" marker-end="url(#arrowHead)"/>
    <rect x="932" y="214" width="210" height="250" rx="6" fill="#111827" stroke="#2A3A52"/>
    <use data-icon="chunk-filled/book-open" x="956" y="238" width="34" height="34" fill="#22C55E"/>
    <text x="956" y="310" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="800" fill="#F8FAFC">上下文治</text>
    <text x="956" y="354" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">small-to-big</text>
    <text x="956" y="388" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">去重预算</text>
    <text x="956" y="422" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" fill="#B6C2D2">来源引用</text>
  </g>
  <g id="takeaway">
    <rect x="120" y="540" width="1040" height="72" rx="6" fill="#111827" stroke="#2A3A52"/>
    <text x="640" y="586" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="700" fill="#F59E0B">这套 RAG 的核心不是搜到，而是“带睢证据回答，并能保守拒答</text>
  </g>
</svg>


