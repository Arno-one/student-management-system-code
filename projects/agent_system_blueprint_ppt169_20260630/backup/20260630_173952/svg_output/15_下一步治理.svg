<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="topologyScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05070D" stop-opacity="0.96" />
      <stop offset="62%" stop-color="#05070D" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#05070D" stop-opacity="0.34" />
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1280" height="720" fill="#05070D" />
    <image href="../images/transition_topology_bg.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect width="1280" height="720" fill="url(#topologyScrim)" />
    <path d="M72 104H1190 M72 616H1190 M104 72V648 M1176 72V648" stroke="#1C2A3D" stroke-width="1" stroke-dasharray="8,4" />
  </g>
  <g id="main-title">
    <text x="76" y="110" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC">朢小闭环已经闭上，下一步重点是治理复杂</text>
    <text x="78" y="158" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#B6C2D2">后续优化不应只横向加功能，应提升能力治理、冷启动、观测和回归效率</text>
  </g>
  <g id="governance-formula">
    <text x="82" y="284" font-family="Consolas, &quot;Microsoft YaHei&quot;, &quot;Courier New&quot;, monospace" font-size="34" font-weight="800" fill="#7DD3FC" id="_edit_10" data-edit-target="true" data-edit-annotation="调整大小：文本超出范围">G_agent = Catalog + Startup + Observe + Regression</text>
    <path d="M84 316H958" stroke="#7DD3FC" stroke-width="2" stroke-dasharray="8,4" />
    <text x="84" y="374" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="34" font-weight="800" fill="#F59E0B">治理的目标不是让功能更多，是让复杂度可被管理</text>
    <text x="84" y="426" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#B6C2D2">
      <tspan x="84" dy="0">当前系统已经把能力协议体验和观测收口</tspan>
      <tspan x="84" dy="36">下一步要让能力目录卡片协议测试数据和监控面板继续沉淀成长期资产</tspan>
    </text>
  </g>
  <g id="next-roadmap">
    <path d="M94 548H1066" stroke="#2A3A52" stroke-width="3" />
    <circle cx="142" cy="548" r="16" fill="#7DD3FC" />
    <text x="142" y="594" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">能力目录</text>
    <circle cx="428" cy="548" r="16" fill="#8B5CF6" />
    <text x="428" y="594" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">卡片扩展</text>
    <circle cx="714" cy="548" r="16" fill="#F59E0B" />
    <text x="714" y="594" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">测试沉淀</text>
    <circle cx="1000" cy="548" r="16" fill="#22C55E" />
    <text x="1000" y="594" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">辅助决策</text>
  </g>
  <g id="right-callout">
    <path d="M1010 220L1176 220L1176 438L1090 492L1010 438Z" fill="#111827" stroke="#2A3A52" />
    <use data-icon="chunk-filled/bolt" x="1068" y="258" width="50" height="50" fill="#F59E0B" />
    <text x="1093" y="350" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="800" fill="#F8FAFC">下一阶段</text>
    <text x="1093" y="392" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#B6C2D2">从定位问</text>
    <text x="1093" y="424" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#B6C2D2">走向辅助决策</text>
  </g>
  <g id="footer">
    <text x="76" y="676" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#7F8EA3">P15 ?breathing page ?Formula + roadmap split</text>
