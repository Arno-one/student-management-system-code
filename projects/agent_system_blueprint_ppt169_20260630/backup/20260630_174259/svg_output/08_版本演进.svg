    <text x="58" y="112" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#B6C2D2">每一版不是单纯加功能，是在补丢块长期运行所霢的工程底座</text>
  </g>
  <g id="milestone-v10">
    <circle cx="120" cy="360" r="22" fill="#7DD3FC" />
    <text x="120" y="300" text-anchor="middle" font-family="Consolas, &quot;Microsoft YaHei&quot;, &quot;Courier New&quot;, monospace" font-size="26" font-weight="700" fill="#7DD3FC">v1.0</text>
