    <text x="120" y="468" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#B6C2D2">RAG / 多轮 / SSE</text>
  </g>
  <g id="milestone-v20">
