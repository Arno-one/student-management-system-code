    <text x="640" y="626" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#F59E0B" id="_edit_26" data-edit-target="true" data-edit-annotation="调整大小：文本超出范围">主线：先跑闭环，再统丢底座，最后把能力收口为可运营系统</text>
