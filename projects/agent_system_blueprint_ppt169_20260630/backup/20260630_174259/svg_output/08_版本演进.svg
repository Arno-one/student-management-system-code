    <text x="380" y="468" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#B6C2D2">BaseTool / HITL</text>
  </g>
  <g id="milestone-v21">
    <circle cx="640" cy="360" r="22" fill="#F59E0B" />
    <text x="640" y="300" text-anchor="middle" font-family="Consolas, &quot;Microsoft YaHei&quot;, &quot;Courier New&quot;, monospace" font-size="26" font-weight="700" fill="#F59E0B">v2.1</text>
    <text x="640" y="430" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">可观测运</text>
    <text x="640" y="468" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" fill="#B6C2D2">反馈 / 监控 / MCP</text>
