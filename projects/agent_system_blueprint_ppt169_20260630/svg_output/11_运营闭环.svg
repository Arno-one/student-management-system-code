    <line x1="640" y1="246" x2="640" y2="174" stroke="#2A3A52" stroke-width="2" />
    <line x1="745" y1="300" x2="980" y2="214" stroke="#2A3A52" stroke-width="2" />
    <line x1="514" y1="390" x2="278" y2="418" stroke="#2A3A52" stroke-width="2" />
    <line x1="766" y1="390" x2="1002" y2="418" stroke="#2A3A52" stroke-width="2" />
    <line x1="640" y1="498" x2="640" y2="586" stroke="#2A3A52" stroke-width="2" />
  </g>
