    <text x="632.152" y="409.417" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" id="_edit_8" data-edit-target="true" data-edit-annotation="调整大小：文本超出范围">Agent 运营面板</text>
    <text x="640" y="448" text-anchor="middle" font-family="Consolas, &quot;Microsoft YaHei&quot;, &quot;Courier New&quot;, monospace" font-size="18" fill="#7DD3FC">dashboard + tasks</text>
  </g>
