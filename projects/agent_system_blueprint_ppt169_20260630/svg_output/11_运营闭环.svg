  <g id="footer">
    <text x="56" y="676" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#7F8EA3">P11 · hub-spoke adaptation · Source: Agent 系统验收说明文档</text>
