    <path d="M64 144H1216 M64 264H1216 M64 384H1216 M64 504H1216 M64 624H1216" stroke="#1C2A3D" stroke-width="1" stroke-dasharray="8,4" />
    <path d="M160 44V676 M320 44V676 M480 44V676 M640 44V676 M800 44V676 M960 44V676 M1120 44V676" stroke="#1C2A3D" stroke-width="1" stroke-opacity="0.42" />
  </g>
  <g id="header">
    <text x="56" y="72" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC">可运营来自任务、反馈、监控和健康状态的闭环</text>
    <text x="58" y="112" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#B6C2D2">系统好不好用不靠主观判断，由 AgentTask、AgentFeedback、Provider 与 MCP 健康状态支撑</text>
  </g>
  <g id="hub-panel">
