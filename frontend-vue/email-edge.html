  --dur-fast: 160ms;

*, *::before, *::after { box-sizing: border-box; }

html, body { min-height: 100%; margin: 0; }

  font-size: 14px;

  inset: 0;

.content {

.sub-bar::before {

.sub-bar select:focus,

.subcard { display: none; }

.subcard.show { display: block; animation: cardReveal .4s var(--ease-out); }

@keyframes cardReveal {

  to {

    transform: translateY(0);

}

  border-radius: 28px;

.card::before {

.field select:focus,
.field textarea:focus {

  20% { transform: translateX(-4px); }
